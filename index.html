<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Com React</title>
    
    <!-- ❌ REMOVE THIS - It's causing conflicts -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    
    <style>
      /* Loading Screen Styles - Pure CSS, no Tailwind needed */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      }

      /* Dark mode support */
      html.dark #app-loader {
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      }

      #app-loader.fade-out {
        opacity: 0;
        transform: scale(1.1);
        pointer-events: none;
      }

      .loader-container {
        text-align: center;
        animation: fadeIn 0.6s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Shopping Cart Icon */
      .cart-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-20px);
        }
        60% {
          transform: translateY(-10px);
        }
      }

      /* Spinner */
      .loader-spinner {
        width: 60px;
        height: 60px;
        border: 5px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loader-text {
        color: white;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: 2px;
      }

      .loader-subtext {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Loading dots */
      .loading-dots {
        display: inline-block;
      }

      .loading-dots span {
        animation: blink 1.4s infinite both;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes blink {
        0%, 80%, 100% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Loading Screen (Pure CSS - No Tailwind conflicts) -->
    <div id="app-loader">
      <div class="loader-container">
        <div class="cart-icon">🛒</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Fay-May Merchandise</div>
        <div class="loader-subtext">
          Loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Apply dark mode from localStorage BEFORE React loads
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      })();
      
      // Remove loader when React is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 500);
          }
        }, 300);
      });
    </script>
  </body>
</html>
